<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiny Triage</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <h1>🗂️ Tiny Triage</h1>
      <p class="subtitle">A tiny board for triaging tasks and issues.</p>
    </header>

    <main>
      <form id="add-form" class="add-form" autocomplete="off">
        <label for="title-input" class="sr-only">New item title</label>
        <input
          id="title-input"
          name="title"
          type="text"
          placeholder="Add a new task or issue…"
          maxlength="200"
          required
        />
        <button type="submit">Add</button>
      </form>

      <p id="error-message" class="error" role="alert" hidden></p>

      <section aria-labelledby="board-heading">
        <h2 id="board-heading" class="sr-only">Board</h2>
        <ul id="item-list" class="item-list"></ul>
        <p id="empty-state" class="empty-state" hidden>No items yet. Add one above! 🎉</p>
      </section>

      <section class="reports" aria-labelledby="reports-heading">
        <h2 id="reports-heading">Activity report</h2>
        <form id="reports-form" class="reports-form" autocomplete="off">
          <div class="reports-field">
            <label for="reports-from">From</label>
            <input id="reports-from" name="from" type="date" />
          </div>
          <div class="reports-field">
            <label for="reports-to">To</label>
            <input id="reports-to" name="to" type="date" />
          </div>
          <fieldset id="reports-type-filter" class="reports-type-filter">
            <legend>Event types</legend>
            <label><input type="checkbox" name="reports-type" value="created" checked /> Created</label>
            <label><input type="checkbox" name="reports-type" value="completed" checked /> Completed</label>
            <label><input type="checkbox" name="reports-type" value="reopened" checked /> Reopened</label>
            <label><input type="checkbox" name="reports-type" value="deleted" checked /> Deleted</label>
          </fieldset>
          <button type="submit">Generate report</button>
        </form>

        <p id="reports-error" class="error" role="alert" hidden></p>

        <div id="reports-totals" class="reports-totals" aria-live="polite"></div>

        <table id="reports-table" class="reports-table" hidden>
          <thead>
            <tr>
              <th>Date</th>
              <th>Created</th>
              <th>Completed</th>
              <th>Reopened</th>
              <th>Deleted</th>
            </tr>
          </thead>
          <tbody id="reports-table-body"></tbody>
        </table>
        <p id="reports-empty" class="empty-state" hidden>No activity in this range.</p>
      </section>
    </main>

    <footer class="app-footer">
      <span id="status-pill" class="status-pill" title="API health">checking…</span>
      <span class="footer-note">Served by a zero-dependency Node HTTP server</span>
    </footer>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
